<!doctype html>
<!--
	Shown when even the app's error page can't render: when the root layout's load fails, as it does
	if the API is down. Self-contained, because the app's styles are not loaded here.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Error · WePush</title>
		<style>
			body {
				display: grid;
				place-items: center;
				min-height: 100dvh;
				margin: 0;
				padding: 1rem;
				background: #faf9f8;
				color: #000;
				font-family: ui-sans-serif, system-ui, sans-serif;
				text-align: center;
				-webkit-font-smoothing: antialiased;
			}

			main {
				max-width: 36rem;
			}

			h1 {
				margin: 0;
				font-size: 2.25rem;
				font-weight: 800;
				line-height: 1.25;
				letter-spacing: -0.02em;
			}

			p {
				margin: 0.75rem 0 0;
				color: #525252;
			}

			.status {
				margin-top: 0.5rem;
				font-size: 0.875rem;
				color: #737373;
			}

			a {
				display: inline-flex;
				align-items: center;
				height: 2.75rem;
				margin-top: 2rem;
				padding: 0 1.5rem;
				border-radius: 9999px;
				background: #000;
				color: #fff;
				font-size: 0.9375rem;
				font-weight: 600;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Something went wrong</h1>
			<p class="status">Error %sveltekit.status%</p>
			<p>%sveltekit.error.message%</p>
			<!-- A full reload, so the app starts over once the API answers. -->
			<a href="" data-sveltekit-reload>Try again</a>
		</main>
	</body>
</html>
