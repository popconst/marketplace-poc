upstream api {
	# Resolve through Docker's DNS at runtime rather than once at startup, so nginx starts
	# without the API and keeps finding it when its container is recreated with a new IP.
	resolver 127.0.0.11 valid=10s;
	zone api 64k;
	server api:3000 resolve;
}

server {
	listen 80;
	root /usr/share/nginx/html;

	gzip on;
	gzip_vary on;
	gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

	location / {
		try_files $uri /200.html;
		# The HTML shell points at hashed bundles, so it must be revalidated for deploys to land.
		add_header Cache-Control "no-cache";
	}

	location /_app/immutable/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /api/ {
		proxy_pass http://api;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
